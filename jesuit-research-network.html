.form-select:not(:disabled):hover {
  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {
  .btn,
  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;
  }

  /* Keep small-screen WebKit from zooming when a text field receives focus. */
  .form-control,
  .form-select {
    font-size: max(16px, var(--font-size-normal));
  }

  .form-control[type=&quot;file&quot;]::file-selector-button {
    min-width: 44px;
    min-height: 44px;
  }

  .form-control-color[type=&quot;color&quot;] {
    width: 44px;
    height: 44px;
  }

  .form-control:is(
    [type=&quot;date&quot;],
    [type=&quot;datetime-local&quot;],
    [type=&quot;month&quot;],
    [type=&quot;time&quot;],
    [type=&quot;week&quot;]
  ) {
    min-width: 0;
    max-width: 100%;
    padding-block: 8px;
  }

  .form-check {
    min-height: 44px;
    padding-inline: 15px;
  }

  .form-check-input {
    position: relative;
  }

  .form-check-input::after {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 44px;
    height: 44px;
    content: &quot;&quot;;
    transform: translate(-50%, -50%);
  }

  .form-check-label {
    display: inline-flex;
    min-width: 44px;
    min-height: 44px;
    align-items: center;
  }

  .form-range {
    height: 44px;
    touch-action: pan-y;
  }

  .form-range::-webkit-slider-runnable-track {
    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: var(--icon-size) !important;
  height: var(--icon-size) !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

  add(&#x27;r-nowakowski&#x27;,[&#x27;e-lublin-union&#x27;,&#x27;e-sandomierz&#x27;,&#x27;e-warsaw&#x27;,&#x27;e-torun-synod&#x27;,&#x27;e-colloquium&#x27;],&#x27;studies event&#x27;);

  links.push({source:&#x27;r-colombo&#x27;,target:&#x27;r-franconi&#x27;,relation:&#x27;collaborates with&#x27;});
  links.push({source:&#x27;r-maryks&#x27;,target:&#x27;r-nowakowski&#x27;,relation:&#x27;collaborates with&#x27;});

  add(&#x27;w-annali&#x27;,[&#x27;p-nappi&#x27;],&#x27;authored by&#x27;);
  add(&#x27;w-annali&#x27;,[&#x27;i-roman-seminary&#x27;],&#x27;documents&#x27;);

  add(&#x27;w-quinque&#x27;,[&#x27;p-rodolfo&#x27;,&#x27;p-pacheco&#x27;,&#x27;p-berno&#x27;,&#x27;p-francisco-antonio&#x27;,&#x27;p-francisco-aranha&#x27;],&#x27;historical protagonist&#x27;);

  add(&#x27;w-madrigali&#x27;,[&#x27;p-battiferri&#x27;,&#x27;p-colonna&#x27;],&#x27;sets poetry by&#x27;);

  add(&#x27;w-blumengarten&#x27;,[&#x27;p-sepp&#x27;],&#x27;authored by&#x27;);
  add(&#x27;w-reissbeschreibung&#x27;,[&#x27;p-sepp&#x27;],&#x27;authored by&#x27;);
  add(&#x27;w-adnotationes&#x27;,[&#x27;p-nadal&#x27;],&#x27;authored by&#x27;);
  add(&#x27;w-imagines&#x27;,[&#x27;p-nadal&#x27;],&#x27;conceived by&#x27;);
  add(&#x27;w-imagines&#x27;,[&#x27;p-jan-wierix&#x27;,&#x27;p-hieronymus-wierix&#x27;,&#x27;p-antoon-wierix&#x27;,&#x27;p-adriaen-collaert&#x27;,&#x27;p-jan2-collaert&#x27;,&#x27;p-mallery&#x27;],&#x27;engraved by&#x27;);
  add(&#x27;w-preparatory-drawings&#x27;,[&#x27;p-agresti&#x27;,&#x27;p-fiammeri&#x27;,&#x27;p-passeri&#x27;,&#x27;p-de-vos&#x27;],&#x27;designed by&#x27;);
  add(&#x27;w-iesu-christi-vita&#x27;,[&#x27;p-de-witte&#x27;],&#x27;woodcuts by&#x27;);
  add(&#x27;w-iesu-christi-vita&#x27;,[&#x27;p-branteghem&#x27;],&#x27;compiled by&#x27;);
  add(&#x27;w-equitis&#x27;,[&#x27;p-drohojewski&#x27;],&#x27;argued author&#x27;);
  add(&#x27;w-foreign-intruders&#x27;,[&#x27;p-bathory&#x27;,&#x27;p-sigismund&#x27;],&#x27;historical frame&#x27;);

  [&#x27;p-nappi&#x27;,&#x27;p-feccia&#x27;,&#x27;p-giustiniani&#x27;,&#x27;p-acquaviva&#x27;,&#x27;p-owen&#x27;,&#x27;p-ignatius&#x27;,&#x27;p-lainez&#x27;,&#x27;p-polanco&#x27;,&#x27;p-ribadeneyra&#x27;,&#x27;p-mercurian&#x27;,&#x27;p-mariana&#x27;,&#x27;p-vazquez&#x27;,&#x27;p-salmeron&#x27;,&#x27;p-nadal&#x27;,&#x27;p-possevino&#x27;,&#x27;p-benci&#x27;,&#x27;p-rodolfo&#x27;,&#x27;p-pacheco&#x27;,&#x27;p-berno&#x27;,&#x27;p-francisco-antonio&#x27;,&#x27;p-francisco-aranha&#x27;,&#x27;p-strada&#x27;,&#x27;p-sepp&#x27;,&#x27;p-ledesma&#x27;,&#x27;p-bellarmino&#x27;,&#x27;p-borja&#x27;,&#x27;p-guzman&#x27;,&#x27;p-loarte&#x27;,&#x27;p-domenech&#x27;,&#x27;p-canisius&#x27;,&#x27;p-fiammeri&#x27;,&#x27;p-skarga&#x27;,&#x27;p-wujek&#x27;,&#x27;p-smiglecki&#x27;,&#x27;p-grodzicki&#x27;,&#x27;p-campion&#x27;].forEach(person =&gt; links.push({source:person,target:&#x27;i-society&#x27;,relation:&#x27;member of&#x27;}));

  const typeNames = {
    researcher:&#x27;researcher&#x27;, topic:&#x27;controlled topic&#x27;, person:&#x27;historical person&#x27;,
    place:&#x27;place studied as a subject&#x27;, institution:&#x27;institution&#x27;,
    work:&#x27;work, project or source&#x27;, method:&#x27;method&#x27;, event:&#x27;historical event&#x27;
  };
  const typeColors = {
    researcher:&#x27;var(--viz-series-1)&#x27;, topic:&#x27;var(--viz-series-2)&#x27;, person:&#x27;var(--viz-series-3)&#x27;,
    place:&#x27;var(--viz-series-4)&#x27;, institution:&#x27;var(--viz-series-5)&#x27;, work:&#x27;var(--viz-series-6)&#x27;,
    method:&#x27;var(--foreground)&#x27;, event:&#x27;var(--muted-foreground)&#x27;
  };
  const symbols = {
    researcher:d3.symbolCircle, topic:d3.symbolCircle, person:d3.symbolTriangle,
    place:d3.symbolDiamond, institution:d3.symbolSquare, work:d3.symbolDiamond2,
    method:d3.symbolCross, event:d3.symbolStar
  };
  const activeTypes = new Set([&#x27;researcher&#x27;,&#x27;topic&#x27;,&#x27;person&#x27;,&#x27;place&#x27;]);
  let simulation;
  let selectedId = null;

  function idOf(value) { return typeof value === &#x27;object&#x27; ? value.id : value; }

  function visibleData() {
    const visibleNodes = nodes.filter(node =&gt; activeTypes.has(node.type)).map(node =&gt; ({...node}));
    const ids = new Set(visibleNodes.map(node =&gt; node.id));
    const visibleLinks = links
      .filter(link =&gt; ids.has(idOf(link.source)) &amp;&amp; ids.has(idOf(link.target)))
      .map(link =&gt; ({source:idOf(link.source),target:idOf(link.target),relation:link.relation}));
    return {visibleNodes,visibleLinks};
  }

  function connectedResearchers(nodeId) {
    const neighborIds = new Set();
    links.forEach(link =&gt; {
      const source = idOf(link.source), target = idOf(link.target);
      if (source === nodeId) neighborIds.add(target);
      if (target === nodeId) neighborIds.add(source);
    });
    return nodes.filter(node =&gt; node.type === &#x27;researcher&#x27; &amp;&amp; neighborIds.has(node.id)).map(node =&gt; node.label);
  }

  function degreeFor(nodeId) {
    return links.filter(link =&gt; idOf(link.source) === nodeId || idOf(link.target) === nodeId).length;
  }

  function resetSelectionText() {
    selection.innerHTML = &#x27;&lt;strong&gt;Select a node&lt;/strong&gt; — its links reveal shared research fields, people, places and source layers.&#x27;;
  }

  function selectNode(node, linkSelection, nodeSelection, labelSelection) {
    selectedId = node ? node.id : null;
    const neighborIds = new Set(selectedId ? [selectedId] : []);
    if (selectedId) links.forEach(link =&gt; {
      const source = idOf(link.source), target = idOf(link.target);
      if (source === selectedId) neighborIds.add(target);
      if (target === selectedId) neighborIds.add(source);
    });
    nodeSelection
      .classed(&#x27;is-selected&#x27;, item =&gt; item.id === selectedId)
      .classed(&#x27;is-dimmed&#x27;, item =&gt; selectedId &amp;&amp; !neighborIds.has(item.id));
    labelSelection.style(&#x27;display&#x27;, item =&gt; {
      if (!selectedId) return item.type === &#x27;researcher&#x27; || degreeFor(item.id) &gt;= (stage.clientWidth &lt; 500 ? 5 : 3) ? null : &#x27;none&#x27;;
      return neighborIds.has(item.id) || item.type === &#x27;researcher&#x27; ? null : &#x27;none&#x27;;
    });
    linkSelection.classed(&#x27;is-neighbor&#x27;, link =&gt; selectedId &amp;&amp; (idOf(link.source) === selectedId || idOf(link.target) === selectedId));
    if (!node) {
      resetSelectionText();
      return;
    }
    const researchers = node.type === &#x27;researcher&#x27; ? [] : connectedResearchers(node.id);
    const degree = degreeFor(node.id);
    const sourceNote = node.materials ? ` Materials: ${node.materials}.` : &#x27;&#x27;;
    const detail = node.desc ? ` ${node.desc}` : &#x27;&#x27;;
    const linked = researchers.length ? ` Researchers: ${researchers.join(&#x27;, &#x27;)}.` : &#x27;&#x27;;
    const subtype = node.subtype ? ` · ${node.subtype}` : &#x27;&#x27;;
    selection.innerHTML = `&lt;strong&gt;${node.label}&lt;/strong&gt; · ${typeNames[node.type]}${subtype} · ${degree} relations.${sourceNote}${detail}${linked}`;
  }

  function render() {
    if (simulation) simulation.stop();
    svg.selectAll(&#x27;g.jrn-layer&#x27;).remove();
    const {visibleNodes,visibleLinks} = visibleData();
    const width = Math.max(320, stage.clientWidth);
    const height = stage.clientHeight;
    svg.attr(&#x27;viewBox&#x27;,`0 0 ${width} ${height}`);
    const graph = svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;,&#x27;jrn-layer&#x27;);
    svg.call(d3.zoom().scaleExtent([0.45,4]).on(&#x27;zoom&#x27;, event =&gt; graph.attr(&#x27;transform&#x27;,event.transform))).on(&#x27;dblclick.zoom&#x27;,null);

    const visibleDegree = new Map(visibleNodes.map(node =&gt; [node.id,0]));
    visibleLinks.forEach(link =&gt; {
      visibleDegree.set(idOf(link.source),(visibleDegree.get(idOf(link.source)) || 0) + 1);
      visibleDegree.set(idOf(link.target),(visibleDegree.get(idOf(link.target)) || 0) + 1);
    });

    const linkSelection = graph.append(&#x27;g&#x27;).selectAll(&#x27;line&#x27;).data(visibleLinks).join(&#x27;line&#x27;)
      .attr(&#x27;class&#x27;,&#x27;jrn-link&#x27;).attr(&#x27;data-relation&#x27;,link =&gt; link.relation);

    const nodeSelection = graph.append(&#x27;g&#x27;).selectAll(&#x27;g&#x27;).data(visibleNodes,node =&gt; node.id).join(&#x27;g&#x27;)
      .attr(&#x27;class&#x27;,&#x27;jrn-node&#x27;)
      .on(&#x27;click&#x27;,(event,node) =&gt; { event.stopPropagation(); selectNode(node,linkSelection,nodeSelection,labelSelection); })
      .on(&#x27;pointerenter&#x27;,(event,node) =&gt; {
        const researchers = connectedResearchers(node.id);
        tooltip.hidden = false;
        tooltip.innerHTML = `&lt;strong&gt;${node.label}&lt;/strong&gt;&lt;br&gt;${typeNames[node.type]}${researchers.length ? `&lt;br&gt;Connected to: ${researchers.join(&#x27;, &#x27;)}` : &#x27;&#x27;}`;
      })
      .on(&#x27;pointermove&#x27;,event =&gt; {
        const box = stage.getBoundingClientRect();
        const tooltipWidth = tooltip.offsetWidth, tooltipHeight = tooltip.offsetHeight;
        tooltip.style.left = `${Math.max(6,Math.min(event.clientX-box.left+12,box.width-tooltipWidth-6))}px`;
        tooltip.style.top = `${Math.max(6,Math.min(event.clientY-box.top+12,box.height-tooltipHeight-6))}px`;
      })
      .on(&#x27;pointerleave&#x27;,() =&gt; { tooltip.hidden = true; });

    nodeSelection.append(&#x27;path&#x27;)
      .attr(&#x27;d&#x27;,node =&gt; d3.symbol().type(symbols[node.type]).size(node.type === &#x27;researcher&#x27; ? 260 : node.type === &#x27;topic&#x27; ? 135 : 108)())
      .attr(&#x27;fill&#x27;,node =&gt; typeColors[node.type])
      .attr(&#x27;fill-opacity&#x27;,node =&gt; node.type === &#x27;method&#x27; || node.type === &#x27;event&#x27; ? 0.74 : 0.84);

    const labelSelection = graph.append(&#x27;g&#x27;).selectAll(&#x27;text&#x27;).data(visibleNodes,node =&gt; node.id).join(&#x27;text&#x27;)
      .attr(&#x27;class&#x27;,node =&gt; &#x27;jrn-label&#x27; + (node.type === &#x27;researcher&#x27; ? &#x27;&#x27; : &#x27; is-secondary&#x27;))
      .attr(&#x27;text-anchor&#x27;,&#x27;middle&#x27;)
      .attr(&#x27;dy&#x27;,node =&gt; node.type === &#x27;researcher&#x27; ? 23 : 19)
      .style(&#x27;display&#x27;,node =&gt; node.type === &#x27;researcher&#x27; || visibleDegree.get(node.id) &gt;= (width &lt; 500 ? 5 : 3) ? null : &#x27;none&#x27;)
      .text(node =&gt; node.label.length &gt; 34 ? node.label.slice(0,32) + &#x27;…&#x27; : node.label);

    const drag = d3.drag()
      .on(&#x27;start&#x27;,(event,node) =&gt; { if (!event.active) simulation.alphaTarget(0.22).restart(); node.fx=node.x; node.fy=node.y; })
      .on(&#x27;drag&#x27;,(event,node) =&gt; { node.fx=event.x; node.fy=event.y; })
      .on(&#x27;end&#x27;,(event,node) =&gt; { if (!event.active) simulation.alphaTarget(0); node.fx=null; node.fy=null; });
    nodeSelection.call(drag);

    simulation = d3.forceSimulation(visibleNodes)
      .randomSource(d3.randomLcg(0.417))
      .force(&#x27;link&#x27;,d3.forceLink(visibleLinks).id(node =&gt; node.id).distance(link =&gt; idOf(link.source).startsWith(&#x27;r-&#x27;) &amp;&amp; idOf(link.target).startsWith(&#x27;r-&#x27;) ? 135 : 70).strength(0.4))
      .force(&#x27;charge&#x27;,d3.forceManyBody().strength(node =&gt; node.type === &#x27;researcher&#x27; ? -430 : -92))
      .force(&#x27;center&#x27;,d3.forceCenter(width/2,height/2))
      .force(&#x27;collide&#x27;,d3.forceCollide().radius(node =&gt; node.type === &#x27;researcher&#x27; ? 36 : 18).iterations(2))
      .force(&#x27;x&#x27;,d3.forceX(width/2).strength(0.03))
      .force(&#x27;y&#x27;,d3.forceY(height/2).strength(0.04))
      .on(&#x27;tick&#x27;,() =&gt; {
        visibleNodes.forEach(node =&gt; {
          node.x = Math.max(26,Math.min(width-26,node.x));
          node.y = Math.max(26,Math.min(height-34,node.y));
        });
        linkSelection.attr(&#x27;x1&#x27;,link =&gt; link.source.x).attr(&#x27;y1&#x27;,link =&gt; link.source.y).attr(&#x27;x2&#x27;,link =&gt; link.target.x).attr(&#x27;y2&#x27;,link =&gt; link.target.y);
        nodeSelection.attr(&#x27;transform&#x27;,node =&gt; `translate(${node.x},${node.y})`);
        labelSelection
          .attr(&#x27;x&#x27;,node =&gt; node.x &lt; 92 ? node.x + 8 : node.x &gt; width - 92 ? node.x - 8 : node.x)
          .attr(&#x27;y&#x27;,node =&gt; node.y)
          .attr(&#x27;text-anchor&#x27;,node =&gt; node.x &lt; 92 ? &#x27;start&#x27; : node.x &gt; width - 92 ? &#x27;end&#x27; : &#x27;middle&#x27;);
      });

    svg.on(&#x27;click&#x27;,() =&gt; selectNode(null,linkSelection,nodeSelection,labelSelection));
    const researcherCount = visibleNodes.filter(node =&gt; node.type === &#x27;researcher&#x27;).length;
    count.textContent = `${researcherCount} researchers · ${visibleNodes.length} visible nodes · ${visibleLinks.length} relations. Drag nodes; zoom with a gesture or mouse wheel.`;
    if (selectedId &amp;&amp; !visibleNodes.some(node =&gt; node.id === selectedId)) selectedId = null;
  }

  root.querySelectorAll(&#x27;[data-type]&#x27;).forEach(button =&gt; button.addEventListener(&#x27;click&#x27;,() =&gt; {
    const type = button.dataset.type;
    if (type === &#x27;researcher&#x27;) return;
    if (activeTypes.has(type)) activeTypes.delete(type); else activeTypes.add(type);
    button.setAttribute(&#x27;aria-pressed&#x27;,activeTypes.has(type) ? &#x27;true&#x27; : &#x27;false&#x27;);
    resetSelectionText();
    selectedId = null;
    render();
  }));

  const observer = new ResizeObserver(() =&gt; render());
  observer.observe(stage);
  render();
})();
&lt;/script&gt;

(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
